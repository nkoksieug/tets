name: Build LinguaLeaf V10.6.0 Full Offline NSIS Fix

on:
  push:
    branches:
      - lingualeaf-build
    paths:
      - lingualeaf-build/**
      - .github/workflows/build-lingualeaf-full-offline.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lingualeaf-v10.6.0-full-offline-nsis-fix
  cancel-in-progress: false

jobs:
  build-windows-x64:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SITES_INSTALL_TIMEOUT: 20m
      SITES_BUILD_TIMEOUT: 10m

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct verified existing source
        shell: bash
        run: |
          set -euo pipefail
          cp lingualeaf-build/source.tar.gz.b64 source.tar.gz
          echo "d966ebca1defe46b25866ff5a303dfdcc806a6623f780ca57d7d55ba130f2651  source.tar.gz" | sha256sum --check --strict
          mkdir app
          tar -xzf source.tar.gz -C app

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install locked dependencies
        working-directory: app
        shell: bash
        run: npm ci

      - name: Prepare OCR and PDF assets
        working-directory: app
        shell: bash
        run: npm run prepare:offline-assets

      - name: Build and test application
        working-directory: app
        shell: bash
        run: |
          npm run build
          node --experimental-strip-types --test tests/layout-order.test.ts tests/translation-progress.test.ts tests/translation-chunks.test.ts tests/language-validation.test.ts
          node --test tests/rendered-html.test.mjs tests/desktop-main.test.mjs tests/reader-features.test.mjs

      - name: Download and verify all four offline models
        working-directory: app
        shell: bash
        run: npm run desktop:models

      - name: Package Windows x64 application
        working-directory: app
        shell: bash
        run: npm run desktop:package

      - name: Verify packaged desktop server and models
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          npm run desktop:smoke
          model_root="artifacts/electron/LinguaLeaf-win32-x64/resources/app/dist/client/models/Xenova"
          for model in opus-mt-en-vi opus-mt-vi-en opus-mt-en-zh opus-mt-zh-en; do
            test -s "${model_root}/${model}/onnx/encoder_model_quantized.onnx"
            test -s "${model_root}/${model}/onnx/decoder_model_merged_quantized.onnx"
          done
          test -s "artifacts/electron/LinguaLeaf-win32-x64/resources/app/dist/client/models/lingualeaf-model-pack.json"

      - name: Install NSIS
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis p7zip-full

      - name: Build standard NSIS installer
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          makensis -V3 \
            -DAPP_DIR="$PWD/artifacts/electron/LinguaLeaf-win32-x64" \
            -DSETUP_PATH="$PWD/artifacts/LinguaLeaf-V10.6.0-Full-Offline-Setup-NSIS.exe" \
            -DICON_PATH="$PWD/packaging/LinguaLeaf.ico" \
            "$GITHUB_WORKSPACE/lingualeaf-build/LinguaLeaf-Installer.nsi"

      - name: Test NSIS archive and record checksum
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          setup="artifacts/LinguaLeaf-V10.6.0-Full-Offline-Setup-NSIS.exe"
          test -s "${setup}"
          test "$(stat -c '%s' "${setup}")" -gt 300000000
          file "${setup}" | grep -q 'PE32'
          7z t "${setup}"
          sha256sum "${setup}" > "${setup}.sha256"
          stat --printf='%n %s bytes\n' "${setup}" artifacts/LinguaLeaf-V10.6.0-Desktop-Source.zip | tee artifacts/SIZES.txt

      - name: Upload fixed full offline installer
        uses: actions/upload-artifact@v4
        with:
          name: LinguaLeaf-V10.6.0-Full-Offline-NSIS-Fix-Windows-x64
          path: |
            app/artifacts/LinguaLeaf-V10.6.0-Full-Offline-Setup-NSIS.exe
            app/artifacts/LinguaLeaf-V10.6.0-Full-Offline-Setup-NSIS.exe.sha256
            app/artifacts/LinguaLeaf-V10.6.0-Desktop-Source.zip
            app/artifacts/SIZES.txt
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
